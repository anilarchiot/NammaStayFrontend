name: Build Windows desktop app

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "*.html"
      - "*.js"
      - "assets/**"
      - "scripts/**"
      - "desktop/**"
      - "mobile/build-web.cjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/desktop-windows.yml"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build Windows installer
        run: npm run desktop:build:win
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      - name: Verify installer signature
        shell: pwsh
        run: |
          $installers = Get-ChildItem release -Filter *.exe
          if (-not $installers) { throw "No Windows installer was produced." }
          foreach ($installer in $installers) {
            $signature = Get-AuthenticodeSignature $installer.FullName
            if ($env:WINDOWS_SIGNING_CONFIGURED -eq "true" -and $signature.Status -ne "Valid") {
              throw "Installer signature is not valid: $($signature.StatusMessage)"
            }
            if ($signature.Status -eq "Valid") {
              Write-Host "$($installer.Name) is signed by $($signature.SignerCertificate.Subject)"
            } else {
              Write-Warning "$($installer.Name) is unsigned. Configure the Windows signing certificate secrets for publisher verification."
            }
          }
        env:
          WINDOWS_SIGNING_CONFIGURED: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 != '' && secrets.WINDOWS_CERTIFICATE_PASSWORD != '' }}
      - uses: actions/upload-artifact@v4
        with:
          name: NammaStay-Windows-installer
          path: release/*.exe
          if-no-files-found: error
