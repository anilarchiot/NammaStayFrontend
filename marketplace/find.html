<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>nammaBookings — find and book stays</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Manrope:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="travel.css">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0E1B3D">
<link rel="icon" href="favicon.png">
</head>
<body>
<header><a class="logo" href="./"><img src="logo.png" alt="">namma<span>Bookings</span></a><nav><a href="./">For hosts</a><a href="host.html">List your property</a></nav></header>
<section class="hero"><h1>Find your next stay</h1><p>Homestays, hotels and resorts across India — book direct with hosts.</p></section>
<main>
  <div id="msg"></div>
  <div id="search" class="card">
    <div class="seg type-tabs" id="types" role="group" aria-label="Property type">
      <button type="button" data-t="" class="on" aria-pressed="true">All stays</button>
      <button type="button" data-t="hostel" aria-pressed="false">Hostels</button>
      <button type="button" data-t="pg" aria-pressed="false">PGs</button>
      <button type="button" data-t="resort" aria-pressed="false">Resorts</button>
      <button type="button" data-t="hotel" aria-pressed="false">Hotels</button>
      <button type="button" data-t="backpackers" aria-pressed="false">Backpackers</button>
      <button type="button" data-t="homestay" aria-pressed="false">Homestays</button>
      <a href="stays.html">Hostel &amp; PG search</a>
    </div>
    <form class="search" id="f">
      <input name="city" placeholder="City or property name">
      <input name="in" type="date" aria-label="Check-in">
      <input name="out" type="date" aria-label="Check-out">
      <input name="guests" type="number" min="1" value="2" aria-label="Guests">
      <button>Search</button>
    </form>
  </div>
  <div id="results" class="grid"></div>
  <div id="detail" hidden></div>
</main>
<script src="config.js"></script>
<script type="module" src="index.js"></script>
</body>
</html>
