<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Self check-in · NammaStay</title>
<meta name="description" content="NammaStay: bookings, beds, check-ins and payments for hostels, hotels and homestays.">
<meta name="theme-color" content="#0E1B3D">
<link rel="icon" type="image/png" href="assets/img/favicon.png">
<link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&amp;family=Manrope:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/styles.css">
<style>
  .fld{height:46px;border-radius:10px;border:1px solid #E2DAC4;padding:0 14px;font-size:14px;font-family:'Manrope',sans-serif;background:#FFFDF6;box-sizing:border-box;outline:none;width:100%;}
</style>
</head>
<body class="ns-page-mobile page-self-check-in">
<div class="ns-phone" style="box-sizing:border-box;background:#FBF3DE;display:flex;flex-direction:column;overflow:hidden;">

  <div style="background:#0E1B3D;padding:22px 20px 20px 20px;display:flex;flex-direction:column;gap:14px;">
    <div style="display:flex;align-items:center;gap:8px;">
      <img src="assets/img/logo.png" alt="NammaStay" style="width:26px;height:26px;object-fit:contain;background:#FBF3DE;border-radius:6px;padding:2px;box-sizing:border-box;">
      <span style="font-family:'Sora',sans-serif;font-size:14px;font-weight:800;color:#FBF3DE;">Namma<span style="color:#1C9A6C;">Stay</span></span>
    </div>
    <div>
      <div style="font-size:11.5px;color:#8B93A8;font-weight:700;">SOCIAL BACKPACKERS HOSTEL</div>
      <div style="font-family:'Sora',sans-serif;font-size:20px;font-weight:700;color:#FBF3DE;margin-top:2px;">Self check-in</div>
    </div>
    <div style="display:flex;gap:6px;">
      <div style="flex:1;height:4px;border-radius:3px;background:#1C9A6C;"></div>
      <div style="flex:1;height:4px;border-radius:3px;background:#1C9A6C;"></div>
      <div style="flex:1;height:4px;border-radius:3px;background:#22305A;"></div>
    </div>
    <div style="font-size:11.5px;color:#AEB6C9;">Step 2 of 3 — Verify your ID</div>
  </div>

  <div style="flex:1;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:16px;">

    <div style="background:#FFFFFF;border:1px solid #E7DFC7;border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:6px;">
      <div style="display:flex;justify-content:space-between;"><span style="font-size:13px;font-weight:700;">Booking BK-2290</span><span style="font-size:11px;padding:3px 8px;border-radius:20px;background:#FCF0DC;color:#966016;font-weight:700;">Pending</span></div>
      <div style="font-size:12px;color:#6B7280;">3-Bed Dorm · Lower C2</div>
      <div style="font-size:12px;color:#6B7280;">22 – 27 Sep 2026 · 5 nights</div>
    </div>

    <div style="display:flex;flex-direction:column;gap:6px;">
      <label style="font-size:12.5px;font-weight:700;">Full name</label>
      <input class="fld" value="Emma Torres">
    </div>
    <div style="display:flex;flex-direction:column;gap:6px;">
      <label style="font-size:12.5px;font-weight:700;">Date of birth</label>
      <input class="fld" value="04 / 11 / 1997">
    </div>
    <div style="display:flex;flex-direction:column;gap:6px;">
      <label style="font-size:12.5px;font-weight:700;">Proof of identity</label>
      <div class="fld" style="display:flex;align-items:center;justify-content:space-between;">Passport <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#6B7280" stroke-width="2"><path d="M6 9l6 6 6-6"></path></svg></div>
    </div>

    <div style="display:flex;flex-direction:column;gap:8px;">
      <label style="font-size:12.5px;font-weight:700;">Upload ID photo</label>
      <div style="height:120px;border-radius:12px;border:1.5px dashed #C9BE9C;background:#FFFDF6;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#9AA3B5" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"></rect><circle cx="9" cy="10" r="1.5"></circle><path d="M21 16l-5.5-5-4.5 4.5"></path></svg>
        <span style="font-size:12px;color:#9AA3B5;font-weight:600;">Tap to take a photo or upload</span>
      </div>
    </div>

    <label style="display:flex;align-items:flex-start;gap:10px;font-size:12px;color:#6B7280;line-height:1.5;">
      <input type="checkbox" checked="" style="width:16px;height:16px;accent-color:#1C9A6C;margin-top:1px;flex-shrink:0;">
      I confirm my details are accurate and agree to the hostel's house rules and check-in policy.
    </label>
  </div>

  <div style="padding:16px 20px 22px 20px;border-top:1px solid #E7DFC7;background:#FBF3DE;display:flex;flex-direction:column;gap:10px;">
    <div style="height:50px;border-radius:12px;background:#1C9A6C;color:#FFFFFF;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;">Continue</div>
    <div style="text-align:center;font-size:12px;color:#9AA3B5;">Need help? Message front desk</div>
  </div>
</div>

<script src="assets/js/app.js" defer></script>
</body>
</html>
